<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now | Explore Nepal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* GLOBAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #050816;
            color: white;
        }

        /* NAVBAR */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            text-transform: uppercase;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 3px;
            font-size: 2rem;
            font-weight: 700;
        }

        .nav-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .book-btn {
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            color: black;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 800;
            text-decoration: none;
        }

        /* HERO */
        .hero {
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: url('https://wallpaperaccess.com/full/166015.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            margin-top: 80px;
        }


        .hero::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .hero h1 {
            position: relative;
            font-size: 4rem;
        }

        /* FORM */
        .booking-section {
            padding: 80px 8%;
            display: flex;
            justify-content: center;
        }

        .form-box {
            background: #081120;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
        }

        h3 {
            color: #d4af37;
            margin: 15px 0;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            background: #101b2d;
            color: white;
        }

        textarea {
            height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            font-weight: 800;
            cursor: pointer;
        }

        /* PAYMENT */
        .payment-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .payment-check input {
            width: auto;
        }

        /* QR */
        .payment-section {
            text-align: center;
            margin: 20px 0;
        }

        .payment-section img {
            width: 220px;
            border-radius: 10px;
        }

        /* FOOTER */
        footer {
            background: #000102;
            text-align: center;
            padding: 60px 20px;
            margin-top: 60px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .social {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
        }

        .social:hover {
            transform: translateY(-5px);
        }

        .facebook:hover {
            background: #1877f2;
        }

        .instagram:hover {
            background: #e1306c;
        }

        .youtube:hover {
            background: #ff0000;
        }
    </style>

</head>

<body>

    <header>
        <nav class="navbar">

            <div class="nav-left">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="gallery.html">Gallery</a>
                <a href="destinations.html" >Destinations</a>
            </div>
           

            <div class="logo">
                 <img src="logo.png" alt="Logo" class="nav-logo">
                EXPLORE NEPAL</div>

            <div class="nav-right">
                <a href="contact.html">Contact</a>
                <a href="book.html" class="book-btn">Book Now</a>
            </div>

        </nav>
    </header>

    <section class="hero">
        <h1>Book Your Journey</h1>
    </section>

    <section class="booking-section">

        <div class="form-box">

            <h3>Personal Details</h3>

            <form id="bookingForm">

                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="number" placeholder="Phone Number" required>

                <h3>Travel Details</h3>

                <select required>
                    <option value="">Select Destination</option>
                    <option>Pokhara</option>
                    <option>Everest Base Camp</option>
                    <option>Lumbini</option>
                    <option>Chitwan</option>
                    <option>Mustang</option>
                </select>

                <input type="date" required>
                <textarea placeholder="Message"></textarea>

                <h3>Payment Section</h3>

                <div class="payment-section">
                    <p>Scan QR & Pay</p>
                    <img src="qr.jpeg" alt="QR">
                </div>

                <input type="text" id="paymentId" placeholder="Transaction ID" required>

                <label class="payment-check">
                    <input type="checkbox" id="paymentCheck">
                    I confirm payment completed
                </label>

                <button type="submit">Confirm Booking</button>

            </form>

        </div>

    </section>

    <footer>

        <h2>Explore Nepal</h2>

        <div class="social-icons">

            <a class="social facebook" href="https://www.facebook.com/rajan.oli.75286"><i
                    class="fab fa-facebook-f"></i></a>
            <a class="social instagram" href="https://www.instagram.com/rajan444706"><i
                    class="fab fa-instagram"></i></a>
            <a class="social youtube" href="https://www.youtube.com/@rajanolwee"><i class="fab fa-youtube"></i></a>

        </div>

        <p>© 2026 Explore Nepal | Designed By Rajan Oli, Manisha Nepali & Krishna Dhawal </p>

    </footer>

    <script>

        document.getElementById("bookingForm").addEventListener("submit", function (e) {

            e.preventDefault();

            const paid = document.getElementById("paymentCheck").checked;
            const txn = document.getElementById("paymentId").value.trim();

            if (!paid) {
                alert("Please confirm payment.");
                return;
            }

            if (txn.length < 6) {
                alert("Enter valid transaction ID.");
                return;
            }

            alert("🎉 Booking Successful!");
            this.reset();

        });

    </script>

</body>

</html>
